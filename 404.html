<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Seite nicht gefunden – 404 – Ingenieur-Tools</title>
<style>
:root{--bg:#0b0f14;--card:#151c25;--border:#232d3a;--text:#e5e9ef;--muted:#8a94a3;--accent:#5b9bd5;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;line-height:1.6;}
.box{max-width:480px;padding:40px;text-align:center;}
.code{font-size:5rem;font-weight:700;background:linear-gradient(90deg,var(--accent),#7fb3e6);-webkit-background-clip:text;
  background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:14px;}
h1{font-size:1.3rem;font-weight:600;margin-bottom:10px;}
p{color:var(--muted);font-size:.95rem;margin-bottom:26px;}
a.btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#08121c;padding:12px 26px;
  border-radius:10px;font-weight:550;text-decoration:none;transition:all .18s;}
a.btn:hover{background:#6ea8de;}
a.btn:hover .arr{transform:translateX(3px);}
.arr{transition:transform .18s;}
</style>
</head>
<body>
<div class="box">
  <div class="code">404</div>
  <h1>Diese Seite existiert nicht</h1>
  <p>Die angeforderte Seite konnte nicht gefunden werden – vielleicht wurde sie verschoben oder ist
  der Link veraltet.</p>
  <a href="https://ingenieur-tools.de/" class="btn">Zur Startseite <span class="arr">→</span></a>
</div>
</body>
</html>
